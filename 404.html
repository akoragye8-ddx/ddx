<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Epitome Dry Cleaners</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F1E7">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/images/favicon-64.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #F5F1E7;
    --navy: #101B3D;
    --blue: #3452D0;
    --blue-deep: #2743B8;
    --ink: #0F1B33;
    --gray: #47505E;
    --line: #E4DFD1;
    --white: #FFFFFF;
    --whatsapp: #15803D;
    --whatsapp-deep: #166534;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'DM Sans', sans-serif; color:var(--ink); background:var(--cream); line-height:1.6;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px;
  }
  a{ text-decoration:none; color:inherit; }
  :focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }
  .card{ max-width:520px; text-align:center; }
  .card > a{ display:block; }
  .card img{ display:block; height:72px; width:auto; margin:0 auto 40px; }
  .eyebrow{ display:block; font-size:13px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--blue); }
  h1{ font-size:40px; font-weight:800; line-height:1.15; letter-spacing:-0.02em; color:var(--navy); margin:12px 0 14px; text-wrap:balance; }
  p{ color:var(--gray); font-size:16px; margin-bottom:32px; }
  .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:15px 28px; border-radius:6px; font-weight:600; font-size:15px; border:2px solid transparent;
  }
  .btn-primary{ background:var(--blue); color:var(--white); }
  .btn-primary:hover{ background:var(--blue-deep); }
  .btn-whatsapp{ background:var(--whatsapp); color:var(--white); }
  .btn-whatsapp:hover{ background:var(--whatsapp-deep); }
</style>
</head>
<body>
  <main class="card">
    <a href="/"><img src="/images/logo.png" alt="Epitome Dry Cleaners home" width="315" height="184"></a>
    <span class="eyebrow">Error 404</span>
    <h1>We couldn't find that page</h1>
    <p>The link may be out of date, or the address may have a typo. Head back to the homepage, or message us and we'll help you book a pickup.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Back to homepage</a>
      <a href="https://wa.me/256789015327" target="_blank" rel="noopener" class="btn btn-whatsapp">Message us on WhatsApp</a>
    </div>
  </main>
</body>
</html>
